   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    background:#f7f7f5;
    color:#171717;

    line-height:1.45;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;

:root{

    --white:#ffffff;

    --gray:#737373;

    --light-gray:#a3a3a3;

    --border:#e5e5e5;

===================================================== */

.header-right{

.header-link{

    text-transform:uppercase;

    margin-bottom:14px;
}

    font-size:
    clamp(35px,6vw,58px);

    line-height:1.02;

    letter-spacing:-3px;

    font-weight:850;

    margin-bottom:14px;
}


.hero h1 span{

    color:var(--blue);
}


.hero-description{

    gap:15px;
}
