<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account — BusUndo</title>

<meta name="description"
      content="Create your BusUndo account and explore Kerala bus routes, timings and services.">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    min-height:100vh;

    background:#f7f7f5;

    color:#171717;

    display:flex;

    flex-direction:column;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

header{

    height:62px;

    background:
    rgba(255,255,255,.94);

    border-bottom:
    1px solid #e5e5e5;

    display:flex;

    align-items:center;

    position:sticky;

    top:0;

    z-index:100;

    backdrop-filter:blur(12px);
}


.header-inner{

    width:100%;

    max-width:1080px;

    margin:auto;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    display:flex;

    align-items:center;

    gap:9px;

    color:#171717;

    font-weight:800;

    font-size:16px;

    letter-spacing:-.5px;
}


.logo-mark{

    width:32px;

    height:32px;

    border-radius:9px;

    background:#171717;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:16px;
}


.logo-sub{

    color:#a3a3a3;

    font-size:9px;

    margin-left:3px;

    font-weight:600;
}


/* =====================================================
   HEADER BUTTON
===================================================== */

.home-btn{

    color:#555;

    font-size:10px;

    font-weight:700;

    padding:8px 11px;

    border-radius:7px;

    transition:.2s;
}


.home-btn:hover{

    background:#f1f1f1;

    color:#111;
}


/* =====================================================
   MAIN
===================================================== */

main{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
    40px 18px;
}


/* =====================================================
   SIGNUP WRAPPER
===================================================== */

.signup-wrapper{

    width:100%;

    max-width:420px;
}


/* =====================================================
   INTRO
===================================================== */

.intro{

    text-align:center;

    margin-bottom:20px;
}


.intro-icon{

    width:48px;

    height:48px;

    border-radius:13px;

    background:#171717;

    color:white;

    margin:
    0 auto 15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);
}


.intro h1{

    font-size:28px;

    letter-spacing:-1.4px;

    font-weight:850;

    margin-bottom:5px;
}


.intro p{

    font-size:10px;

    color:#888;

    line-height:1.5;
}


/* =====================================================
   SIGNUP CARD
===================================================== */

.signup-card{

    background:#fff;

    border:
    1px solid #e5e5e5;

    border-radius:13px;

    padding:21px;

    box-shadow:
    0 8px 30px
    rgba(0,0,0,.035);
}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:13px;
}


.form-group label{

    display:block;

    font-size:9px;

    font-weight:800;

    color:#444;

    margin-bottom:6px;
}


.input-wrapper{

    position:relative;
}


.input-wrapper input{

    width:100%;

    height:41px;

    border:
    1px solid #dedede;

    border-radius:8px;

    padding:
    0 12px;

    background:#fafafa;

    color:#171717;

    outline:none;

    font-size:11px;

    transition:.2s;
}


.input-wrapper input:focus{

    background:#fff;

    border-color:#171717;

    box-shadow:
    0 0 0 3px
    rgba(0,0,0,.05);
}


.input-wrapper input::placeholder{

    color:#aaa;
}


/* =====================================================
   NAME GRID
===================================================== */

.name-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;
}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

.password-toggle{

    position:absolute;

    right:10px;

    top:50%;

    transform:
    translateY(-50%);

    border:0;

    background:none;

    color:#888;

    font-size:9px;

    cursor:pointer;
}


.password-toggle:hover{

    color:#171717;
}


/* =====================================================
   PASSWORD STRENGTH
===================================================== */

.password-strength{

    margin-top:6px;

    display:none;
}


.strength-bar{

    height:4px;

    background:#eee;

    border-radius:10px;

    overflow:hidden;
}


.strength-fill{

    height:100%;

    width:0%;

    background:#ef4444;

    transition:.25s;
}


.strength-text{

    margin-top:4px;

    font-size
